# default

<VirtualHost 127.0.0.1:18080>
    ErrorLog /dev/null
    CustomLog /dev/null combined
</VirtualHost>

## panel

<VirtualHost 127.0.0.1:18081>
	DocumentRoot /opt/miz-hproxy/panel

    ErrorLog /var/log/apache2/0-admin.error.log
	CustomLog /dev/null combined

	<Directory /opt/miz-hproxy/panel>
		Options -MultiViews -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted

        <FilesMatch "\.php$">
		    <If "-f %{REQUEST_FILENAME}">
		        ProxyFCGISetEnvIf "true" HTTPS on
                ProxyFCGISetEnvIf "true" SERVER_PORT 443
                ProxyFCGISetEnvIf "true" REQUEST_SCHEME https
    
			    SetHandler "proxy:unix:/run/php/php-fpm-0-miz-hproxy-admin.sock|fcgi://localhost"
		    </If>
	    </FilesMatch>
    </Directory>

    <Directory /opt/miz-hproxy/tpl>
        Require all denied
    </Directory>

    ProxyPass /file-manager/ http://127.0.0.1:12088/

</VirtualHost>
