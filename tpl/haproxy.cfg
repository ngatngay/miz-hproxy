global
    chroot /var/lib/haproxy

	#log /dev/log local0
	#log /dev/log local1 notice

	stats socket /run/haproxy/admin.sock mode 660 level admin
	stats timeout 30s

	user haproxy
	group haproxy

	daemon

	# https://ssl-config.mozilla.org/#server=haproxy&version=3.2&config=intermediate&openssl=3.0.13&guideline=5.7
    ssl-default-bind-curves X25519:prime256v1:secp384r1
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options prefer-client-ciphers ssl-min-ver TLSv1.2 no-tls-tickets


defaults
	#log global
	mode http
	balance roundrobin
	#option httplog
	#option dontlognull

    timeout connect 20s

    timeout client 600s
    timeout server 600s

	errorfile 400 /etc/haproxy/errors/400.http
	errorfile 403 /etc/haproxy/errors/403.http
	errorfile 408 /etc/haproxy/errors/408.http
	errorfile 500 /etc/haproxy/errors/500.http
	errorfile 502 /etc/haproxy/errors/502.http
	errorfile 503 /etc/haproxy/errors/503.http
	errorfile 504 /etc/haproxy/errors/504.http


frontend miz_http
    bind :80
    mode http

    # auto acme
    acl is_acme_challenge path_beg /.well-known/acme-challenge/
    http-request redirect scheme https if !is_acme_challenge

    http-request set-header X-Forwarded-Proto http

    use_backend miz_backend_acme if is_acme_challenge


frontend miz_https
    bind :443 ssl crt /var/lib/haproxy/certs/
    mode http

    http-request set-header X-Forwarded-Proto https

#miz_frontend


#miz_backend


listen miz_stats
    bind 127.0.0.1:19869
    mode http
    maxconn 5

    stats enable
    stats uri /stats
    stats hide-version


backend miz_backend_acme
    mode http
    option forwardfor except 127.0.0.1
    timeout queue 5s

    server proxy 127.0.0.1:18082 alpn http/1.1 maxconn 5


frontend miz_admin
    bind :2083 ssl crt /var/lib/haproxy/certs/0.pem
    mode http

    http-request set-header X-Forwarded-Proto https
    default_backend miz_admin_backend


backend miz_admin_backend
    mode http
    option forwardfor except 127.0.0.1
    server proxy 127.0.0.1:18081 check
